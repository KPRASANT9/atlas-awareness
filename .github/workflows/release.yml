name: Create v1.0.1 release
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release v1.0.1 if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          Complete sharded public tree for the Global Anthem Atlas (site data for map/explore).

          Author: atlas-awareness (name and affiliation).
          Built with AI agents; atlas-awareness is responsible for the content.

          This archive is the public package only. It does not include withheld lyrics,
          agent translations, or the raw in-copyright lyric table.

          Licences: data CC BY-SA 4.0; code MIT.

          Prefer this tag over v1.0.0 for Zenodo: it includes all song shards and world-arc shards.
          Enable the repo at https://zenodo.org/account/settings/github/ then publish this release.
          EOF
          gh release create v1.0.1 --target "${GITHUB_SHA}" --title "v1.0.1 Global Anthem Atlas" --notes-file /tmp/release-notes.md
